services:
  jinya-postgres-database:
    image: library/postgres:18
    environment:
      POSTGRES_DB: jinya
      POSTGRES_PASSWORD: jinya
      POSTGRES_ROOT_PASSWORD: jinya
      POSTGRES_USER: jinya
    ports:
      - 5439:5432
  jinya-mailer:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - 8625:8025
      - 1625:1025

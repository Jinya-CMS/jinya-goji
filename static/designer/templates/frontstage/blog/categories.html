<div class="cosmo-side-list is--blog-categories" x-data="categoriesData">
  <nav class="cosmo-side-list__items is--blog-categories">
    <template :key="category.id" x-for="category in categories">
      <a
        :class="{ 'is--active': selectedCategory?.id === category.id }"
        :style="{ '--nesting': category.nesting }"
        @click="selectCategory(category)"
        class="cosmo-side-list__item is--tree"
        x-text="category.name"
      ></a>
    </template>
    <button
      @click="openCreateDialog(null)"
      class="cosmo-button is--full-width"
      x-localize:blog-categories-action-new
    ></button>
  </nav>
  <template x-if="selectedCategory">
    <div class="cosmo-side-list__content jinya-designer">
      <div class="jinya-designer__title">
        <span class="cosmo-title" x-text="title"></span>
      </div>
      <cms-sparkline
        :entity-id="selectedCategory.id"
        class="jinya-designer__sparkline"
        type="blog-category"
      ></cms-sparkline>
      <div class="cosmo-toolbar is--designer">
        <div class="cosmo-toolbar__group">
          <button
            @click="openCreateDialog(selectedCategory)"
            class="cosmo-button"
            x-localize:blog-categories-action-new_sub
          ></button>
        </div>
        <div class="cosmo-toolbar__group">
          <button @click="openEditDialog" class="cosmo-button" x-localize:blog-categories-action-edit></button>
          <template x-if="canDelete()">
            <button @click="deleteCategory" class="cosmo-button" x-localize:blog-categories-action-delete></button>
          </template>
        </div>
      </div>
      <div class="jinya-designer__content is--blog-categories">
        <dl class="cosmo-list is--key-value is--blog-categories">
          <dt x-localize:blog-categories-details-name></dt>
          <dd x-text="selectedCategory.name"></dd>
          <template x-if="selectedCategory.description">
            <div style="display: contents">
              <dt x-localize:blog-categories-details-description></dt>
              <dd x-text="selectedCategory.description"></dd>
            </div>
          </template>
          <template x-if="selectedCategory.webhookUrl">
            <div style="display: contents">
              <dt x-localize:blog-categories-details-webhook></dt>
              <dd class="jinya-category__webhook">
                <template x-if="selectedCategory.webhookEnabled">
                  <svg class="jinya-icon is--positive is--small" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="m9 12 2 2 4-4" />
                  </svg>
                </template>
                <template x-if="!selectedCategory.webhookEnabled">
                  <svg class="jinya-icon is--negative is--small" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="m15 9-6 6" />
                    <path d="m9 9 6 6" />
                  </svg>
                </template>
                <span x-text="selectedCategory.webhookUrl"></span>
              </dd>
            </div>
          </template>
        </dl>
      </div>
    </div>
  </template>
  <template x-if="create.open">
    <form @submit.prevent="createCategory" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:blog-categories-create-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="create.error.hasError">
            <span class="cosmo-message__header" x-text="create.error.title"></span>
            <p class="cosmo-message__message" x-text="create.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="createName" x-localize:blog-categories-create-name></label>
            <input class="cosmo-input" id="createName" required type="text" x-model="create.name" />
            <label class="cosmo-label" for="createDescription" x-localize:blog-categories-create-description></label>
            <textarea class="cosmo-textarea" id="createDescription" rows="10" x-model="create.description"></textarea>
            <label class="cosmo-label" for="createWebhookUrl" x-localize:blog-categories-create-webhook_url></label>
            <input class="cosmo-input" id="createWebhookUrl" type="text" x-model="create.webhookUrl" />
            <div class="cosmo-input__group is--checkbox">
              <input class="cosmo-checkbox" id="createWebhookEnabled" type="checkbox" x-model="create.webhookEnabled" />
              <label
                class="cosmo-label"
                for="createWebhookEnabled"
                x-localize:blog-categories-create-webhook_enabled
              ></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="create.open = false"
            class="cosmo-button"
            type="button"
            x-localize:blog-categories-create-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:blog-categories-create-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updateCategory" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:blog-categories-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editName" x-localize:blog-categories-edit-name></label>
            <input class="cosmo-input" id="editName" required type="text" x-model="edit.name" />
            <label
              class="cosmo-label is--textarea"
              for="editDescription"
              x-localize:blog-categories-edit-description
            ></label>
            <textarea class="cosmo-textarea" id="editDescription" rows="10" x-model="edit.description"></textarea>
            <label class="cosmo-label" for="editWebhookUrl" x-localize:blog-categories-edit-webhook_url></label>
            <input class="cosmo-input" id="editWebhookUrl" type="text" x-model="edit.webhookUrl" />
            <div class="cosmo-input__group is--checkbox">
              <input class="cosmo-checkbox" id="editWebhookEnabled" type="checkbox" x-model="edit.webhookEnabled" />
              <label
                class="cosmo-label"
                for="editWebhookEnabled"
                x-localize:blog-categories-edit-webhook_enabled
              ></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="edit.open = false"
            class="cosmo-button"
            type="button"
            x-localize:blog-categories-edit-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:blog-categories-edit-update></button>
        </div>
      </div>
    </form>
  </template>
</div>

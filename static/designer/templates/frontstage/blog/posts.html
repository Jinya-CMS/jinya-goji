<div class="cosmo-side-list is--blog-categories" x-data="postsData">
  <nav class="cosmo-side-list__items is--blog-categories">
    <a
      :class="{ 'is--active': selectedCategory === null }"
      @click="selectCategory(null)"
      class="cosmo-side-list__item"
      x-localize:blog-posts-overview-all
    ></a>
    <template :key="category.id" x-for="category in categories">
      <a
        :class="{ 'is--active': selectedCategory?.id === category.id }"
        :style="{ '--nesting': category.nesting }"
        @click="selectCategory(category)"
        class="cosmo-side-list__item is--tree"
        x-text="category.name"
      ></a>
    </template>
  </nav>
  <div class="cosmo-side-list__content jinya-designer">
    <div class="jinya-designer__title">
      <span class="cosmo-title" x-text="title"></span>
    </div>
    <cms-sparkline :entity-id="selectedPost?.id" class="jinya-designer__sparkline" type="blog-post"></cms-sparkline>
    <div class="cosmo-toolbar is--designer">
      <div class="cosmo-toolbar__group">
        <button @click="openCreateDialog" class="cosmo-button" x-localize:blog-posts-overview-action-new></button>
      </div>
      <template x-if="selectedPost">
        <div class="cosmo-toolbar__group">
          <button type="submit" form="previewForm" class="cosmo-button" x-localize:pages-modern-action-preview></button>
          <button
            @click="savePost"
            class="cosmo-button is--primary"
            x-localize:blog-posts-overview-action-save
          ></button>
        </div>
      </template>
      <template x-if="!selectedPost">
        <div class="cosmo-toolbar__group">
          <span class="cosmo-button is--primary is--disabled" x-localize:blog-posts-overview-action-save></span>
        </div>
      </template>
      <div class="cosmo-toolbar__group">
        <button
          :disabled="selectedPost?.public"
          @click="publishPost"
          class="cosmo-button"
          x-localize:blog-posts-overview-action-publish
        ></button>
        <button
          :disabled="!selectedPost?.public"
          @click="unpublishPost"
          class="cosmo-button"
          x-localize:blog-posts-overview-action-unpublish
        ></button>
      </div>
      <div class="cosmo-toolbar__group">
        <button
          :disabled="!selectedPost"
          @click="openEditDialog"
          class="cosmo-button"
          x-localize:blog-posts-overview-action-edit
        ></button>
        <button
          :disabled="!selectedPost"
          @click="deletePost"
          class="cosmo-button"
          x-localize:blog-posts-overview-action-delete
        ></button>
      </div>
      <input
        x-model="searchTerm"
        type="search"
        class="cosmo-input is--sidelist-search is--blog"
        x-localize:search-placeholder.placeholder
      />
    </div>
    <div :class="{ 'has--selection': selectedPost !== null }" class="jinya-designer__content is--blog-posts">
      <template x-if="posts.length > 0">
        <div style="display: contents">
          <div class="jinya-blog-tile__container" x-ref="tileContainer">
            <template :key="post.id" x-for="(post, index) in filteredPosts">
              <div
                :class="{ 'is--selected': selectedPost?.id === post.id }"
                @click="selectPost(index, post)"
                class="jinya-blog-tile"
              >
                <span class="jinya-blog-tile__title">
                  <span :title="getPostTitle(post)" x-text="getPostTitle(post)"></span>
                  <template x-if="post.public">
                    <svg class="jinya-icon is--positive" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10" />
                      <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                      <path d="M2 12h20" />
                    </svg>
                  </template>
                  <template x-if="!post.public">
                    <svg class="jinya-icon is--negative" viewBox="0 0 24 24">
                      <path d="M15.686 15A14.5 14.5 0 0 1 12 22a14.5 14.5 0 0 1 0-20 10 10 0 1 0 9.542 13" />
                      <path d="M2 12h8.5" />
                      <path d="M20 6V4a2 2 0 1 0-4 0v2" />
                      <rect height="5" rx="1" width="8" x="14" y="6" />
                    </svg>
                  </template>
                </span>
                <template x-if="post.headerImage">
                  <img :alt="post.headerImage?.name" :src="post.headerImage?.path" class="jinya-blog-tile__img" />
                </template>
              </div>
            </template>
          </div>
          <template x-if="selectedPost !== null">
            <div style="display: contents">
              <form id="previewForm" method="post" target="_blank" action="/form-api/preview/blog-post">
                <input type="hidden" name="id" :value="selectedPost.id" />
                <input type="hidden" name="sections" :value="sectionsString" />
              </form>
              <div class="jinya-blog__separator"></div>
              <div class="jinya-blog__editor">
                <div
                  :class="{ 'is--negative': message.isNegative, 'is--positive': !message.isNegative }"
                  class="cosmo-message is--blog"
                  x-show="message.hasMessage"
                >
                  <span class="cosmo-message__header" x-text="message.title"></span>
                  <p class="cosmo-message__message" x-text="message.content"></p>
                </div>
                <template :key="section.uniqueId" x-for="(section, index) in sections">
                  <div style="display: contents">
                    <div
                      class="jinya-section-editor__button is--add"
                      x-data="{ addOpen: false, buttonId: $id('add-section') }"
                    >
                      <button
                        :class="{ 'is--open': addOpen }"
                        :id="buttonId"
                        @click="addOpen = !addOpen"
                        class="cosmo-button is--circle is--primary is--add is--section"
                      >
                        <svg class="jinya-icon is--add is--section" viewBox="0 0 24 24">
                          <path d="M5 12h14" />
                          <path d="M12 5v14" />
                        </svg>
                      </button>
                      <div
                        class="jinya-section-type-popup"
                        x-anchor="document.getElementById(buttonId)"
                        x-collapse
                        x-show="addOpen"
                      >
                        <button
                          @click="() => {
                  addOpen = false;
                  insertImageSection(index);
                }"
                          class="cosmo-button is--circle is--primary is--icon"
                        >
                          <svg height="16" viewBox="0 0 24 24" width="16">
                            <rect height="18" rx="2" ry="2" width="18" x="3" y="3" />
                            <circle cx="9" cy="9" r="2" />
                            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                          </svg>
                        </button>
                        <template x-if="galleries.length > 0">
                          <button
                            @click="() => {
                    addOpen = false;
                    insertGallerySection(index);
                  }"
                            class="cosmo-button is--circle is--primary is--icon"
                          >
                            <svg height="16" viewBox="0 0 24 24" width="16">
                              <path d="M18 22H4a2 2 0 0 1-2-2V6" />
                              <path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18" />
                              <circle cx="12" cy="8" r="2" />
                              <rect height="16" rx="2" width="16" x="6" y="2" />
                            </svg>
                          </button>
                        </template>
                        <button
                          @click="() => {
                  addOpen = false;
                  insertHtmlSection(index);
                }"
                          class="cosmo-button is--circle is--primary is--icon"
                        >
                          <svg height="16" viewBox="0 0 24 24" width="16">
                            <path
                              d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"
                            />
                            <path
                              d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"
                            />
                          </svg>
                        </button>
                      </div>
                    </div>
                    <section class="jinya-section-editor__entry">
                      <div class="jinya-section-editor__details">
                        <template x-if="section.type === 'file'">
                          <figure class="jinya-section-editor__content is--file">
                            <img
                              :alt="section.file.name"
                              :src="section.file.path"
                              class="jinya-section-editor__image is--file"
                            />
                            <figcaption
                              class="jinya-section-editor__caption is--file"
                              x-data="{ id: $id('section-file') }"
                            >
                              <span class="jinya-section-editor__caption is--file" x-text="section.file.name"></span>
                              <label
                                :for="id"
                                class="cosmo-label is--link"
                                x-localize:pages-modern-designer-link
                              ></label>
                              <input :id="id" class="cosmo-input is--link" type="text" x-model="section.link" />
                            </figcaption>
                          </figure>
                        </template>
                        <template x-if="section.type === 'gallery'">
                          <div class="jinya-section-editor__content is--gallery">
                            <select @input="(e) => changeSectionGallery(index, e)" class="cosmo-select is--gallery">
                              <template :key="gallery.id" x-for="(gallery, galleryIdx) in galleries">
                                <option
                                  :selected="gallery.id === section.gallery?.id"
                                  :value="galleryIdx"
                                  x-text="gallery.name"
                                ></option>
                              </template>
                            </select>
                            <div class="jinya-section-editor__gallery">
                              <template :key="position.id" x-for="position in getPositions(section.gallery)">
                                <img
                                  :alt="position.file.name"
                                  :src="position.file.path"
                                  class="jinya-section-editor__image jinya-media-tile is--designer"
                                />
                              </template>
                            </div>
                          </div>
                        </template>
                        <template x-if="section.type === 'html'">
                          <div class="jinya-section-editor__content is--html">
                            <cms-inline-editor
                              :content="section.html"
                              @change="(e) => updateHtmlSection(index, e.target.value)"
                              type="blog-post"
                            ></cms-inline-editor>
                          </div>
                        </template>
                      </div>
                      <div class="jinya-designer-item__edit is--section">
                        <template x-if="section.file">
                          <button @click="selectFile(section, index)" class="cosmo-button is--icon is--primary">
                            <svg viewBox="0 0 24 24">
                              <rect height="18" rx="2" ry="2" width="18" x="3" y="3" />
                              <circle cx="9" cy="9" r="2" />
                              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                            </svg>
                          </button>
                        </template>
                        <button @click="deleteSection(section, index)" class="cosmo-button is--icon is--negative">
                          <svg viewBox="0 0 24 24">
                            <path d="M3 6h18" />
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                          </svg>
                        </button>
                      </div>
                    </section>
                  </div>
                </template>
                <div class="jinya-section-editor__button is--add is--last" x-data="{ addOpen: false }">
                  <button
                    :class="{ 'is--open': addOpen }"
                    @click="addOpen = !addOpen"
                    class="cosmo-button is--circle is--primary is--add is--section"
                    x-ref="lastOpenAddButtons"
                  >
                    <svg class="jinya-icon is--add is--section" viewBox="0 0 24 24">
                      <path d="M5 12h14" />
                      <path d="M12 5v14" />
                    </svg>
                  </button>
                  <div class="jinya-section-type-popup" x-anchor="$refs.lastOpenAddButtons" x-collapse x-show="addOpen">
                    <button
                      @click="() => {
                  addOpen = false;
                  insertImageSection(sections.length);
                }"
                      class="cosmo-button is--circle is--primary is--icon"
                    >
                      <svg height="16" viewBox="0 0 24 24" width="16">
                        <rect height="18" rx="2" ry="2" width="18" x="3" y="3" />
                        <circle cx="9" cy="9" r="2" />
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                      </svg>
                    </button>
                    <template x-if="galleries.length > 0">
                      <button
                        @click="() => {
                    addOpen = false;
                    insertGallerySection(sections.length);
                  }"
                        class="cosmo-button is--circle is--primary is--icon"
                      >
                        <svg height="16" viewBox="0 0 24 24" width="16">
                          <path d="M18 22H4a2 2 0 0 1-2-2V6" />
                          <path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18" />
                          <circle cx="12" cy="8" r="2" />
                          <rect height="16" rx="2" width="16" x="6" y="2" />
                        </svg>
                      </button>
                    </template>
                    <button
                      @click="() => {
                  addOpen = false;
                  insertHtmlSection(sections.length);
                }"
                      class="cosmo-button is--circle is--primary is--icon"
                    >
                      <svg height="16" viewBox="0 0 24 24" width="16">
                        <path
                          d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"
                        />
                        <path
                          d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <button @click="selectPost(null, null)" class="cosmo-button is--circle is--close is--blog is--icon">
                <svg viewBox="0 0 24 24">
                  <path d="M18 6 6 18" />
                  <path d="m6 6 12 12" />
                </svg>
              </button>
            </div>
          </template>
        </div>
      </template>
      <template x-if="posts.length === 0">
        <div class="cosmo-message is--information">
          <span class="cosmo-message__header" x-localize:blog-posts-overview-empty-header></span>
          <p class="cosmo-message__message" x-localize:blog-posts-overview-empty-message></p>
        </div>
      </template>
    </div>
  </div>
  <template x-if="create.open">
    <form @submit.prevent="createPost" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:blog-posts-create-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="create.error.hasError">
            <span class="cosmo-message__header" x-text="create.error.title"></span>
            <p class="cosmo-message__message" x-text="create.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="createTitle" x-localize:blog-posts-create-post_title></label>
            <input class="cosmo-input" id="createTitle" required type="text" x-model="create.title" />
            <label class="cosmo-label" for="createSlug" x-localize:blog-posts-create-slug></label>
            <input class="cosmo-input" id="createSlug" required type="text" x-model="create.slug" />
            <span class="cosmo-input__message is--information" x-localize:blog-posts-create-slug_help></span>
            <div style="display: contents">
              <label class="cosmo-label" for="createCategory" x-localize:blog-posts-create-category></label>
              <select class="cosmo-select" id="createCategory" x-model.number="create.categoryId">
                <option :value="null" x-localize:blog-posts-create-no_category></option>
                <template x-for="category in categories">
                  <option
                    :selected="category.id == create.categoryId"
                    :value="category.id"
                    x-html="getCategoryOptionLabel(category)"
                  ></option>
                </template>
              </select>
            </div>
            <label class="cosmo-label" for="createHeaderImage" x-localize:blog-posts-create-header_image></label>
            <button
              :data-picker="create.picker.label"
              @click="selectCreateHeaderImage"
              class="cosmo-input is--picker"
              id="createHeaderImage"
              type="button"
              x-text="create.picker.selected"
            ></button>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="create.open = false"
            class="cosmo-button"
            type="button"
            x-localize:blog-posts-create-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:blog-posts-create-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updatePost" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:blog-posts-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editTitle" x-localize:blog-posts-edit-post_title></label>
            <input class="cosmo-input" id="editTitle" required type="text" x-model="edit.title" />
            <label class="cosmo-label" for="editSlug" x-localize:blog-posts-edit-slug></label>
            <input class="cosmo-input" id="editSlug" required type="text" x-model="edit.slug" />
            <span class="cosmo-input__message is--information" x-localize:blog-posts-edit-slug_help></span>
            <div style="display: contents">
              <label class="cosmo-label" for="editCategory" x-localize:blog-posts-edit-category></label>
              <select class="cosmo-select" id="editCategory" x-model.number="edit.categoryId">
                <option :value="null" x-localize:blog-posts-edit-no_category></option>
                <template x-for="category in categories">
                  <option
                    :selected="category.id == edit.categoryId"
                    :value="category.id"
                    x-html="getCategoryOptionLabel(category)"
                  ></option>
                </template>
              </select>
            </div>
            <label class="cosmo-label" for="editHeaderImage" x-localize:blog-posts-edit-header_image></label>
            <button
              :data-picker="edit.picker.label"
              @click="selectEditHeaderImage"
              class="cosmo-input is--picker"
              id="editHeaderImage"
              type="button"
              x-text="edit.picker.selected"
            ></button>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="edit.open = false"
            class="cosmo-button"
            type="button"
            x-localize:blog-posts-edit-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:blog-posts-edit-update></button>
        </div>
      </div>
    </form>
  </template>
</div>

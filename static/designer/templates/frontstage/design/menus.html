<div class="cosmo-side-list" x-data="menusData">
  <nav class="cosmo-side-list__items">
    <template :key="menu.id" x-for="menu in menus">
      <a
        :class="{ 'is--active': selectedMenu?.id === menu.id }"
        @click="selectMenu(menu)"
        class="cosmo-side-list__item"
        x-text="menu.name"
      ></a>
    </template>
    <button @click="openCreateDialog" class="cosmo-button is--full-width" x-localize:design-menus-action-new></button>
  </nav>
  <template x-if="selectedMenu">
    <div class="cosmo-side-list__content jinya-designer">
      <div class="jinya-designer__title">
        <span class="cosmo-title" x-text="selectedMenu.name"></span>
      </div>
      <div class="cosmo-toolbar is--menu">
        <div class="cosmo-toolbar__group">
          <button @click="openEditDialog" class="cosmo-button" x-localize:design-menus-action-edit></button>
          <button @click="deleteMenu" class="cosmo-button" x-localize:design-menus-action-delete></button>
        </div>
        <div class="cosmo-toolbar__group">
          <button
            @click="saveItems"
            class="cosmo-button is--primary"
            x-localize:design-menus-action-save_items
          ></button>
        </div>
      </div>
      <div class="jinya-menu-designer">
        <div
          :class="{ 'is--negative': updateItems.message.isNegative, 'is--positive': !updateItems.message.isNegative }"
          class="cosmo-message is--menu"
          x-show="updateItems.message.hasMessage"
        >
          <span class="cosmo-message__header" x-text="updateItems.message.title"></span>
          <p class="cosmo-message__message" x-text="updateItems.message.content"></p>
        </div>
        <template :key="index" x-for="(item, index) in items">
          <div style="display: contents">
            <button @click="openAddItemDialog(index)" class="cosmo-button is--circle is--primary is--add is--menu">
              <svg
                class="jinya-icon is--add is--menu"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
            </button>
            <div
              :style="{ '--nesting': item.nesting }"
              @dragover.prevent="dragOver(item, index)"
              @dragstart="startItemDrag(item, index)"
              class="jinya-designer-item is--menu"
              draggable="true"
            >
              <span class="jinya-designer-item__title" x-text="getItemTitle(item)"></span>
              <div class="jinya-designer-item__details is--menu" x-data="{ itemLabel: getItemLabel(item) }">
                <svg
                  :fill="item.highlighted ? 'var(--primary-color)' : 'none'"
                  height="1rem"
                  stroke="var(--primary-color)"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                  width="1rem"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
                <span x-text="item.title"></span>
                <template x-if="itemLabel">
                  <div style="display: contents">
                    –
                    <span x-text="itemLabel"></span>
                  </div>
                </template>
                <template x-if="item.route">
                  <span> (<a href="" x-text="item.route"></a>) </span>
                </template>
              </div>
              <div class="jinya-designer-item__edit">
                <button
                  :disabled="item.nesting === 0"
                  @click="decreaseItemNesting(item, index)"
                  class="cosmo-button is--icon is--primary"
                  x-localize:design-menus-action-decrease_nesting.title
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="7 8 3 12 7 16" />
                    <line x1="21" x2="11" y1="12" y2="12" />
                    <line x1="21" x2="11" y1="6" y2="6" />
                    <line x1="21" x2="11" y1="18" y2="18" />
                  </svg>
                </button>
                <button
                  :disabled="index === 0 || item.nesting > items[index - 1].nesting"
                  @click="increaseItemNesting(item, index)"
                  class="cosmo-button is--icon is--primary"
                  x-localize:design-menus-action-increase_nesting.title
                >
                  <svg viewBox="0 0 24 24">
                    <polyline points="3 8 7 12 3 16" />
                    <line x1="21" x2="11" y1="12" y2="12" />
                    <line x1="21" x2="11" y1="6" y2="6" />
                    <line x1="21" x2="11" y1="18" y2="18" />
                  </svg>
                </button>
                <button
                  @click="openEditItemDialog(item, index)"
                  class="cosmo-button is--icon is--primary"
                  x-localize:design-menus-action-edit_item.title
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                    <path d="m15 5 4 4" />
                  </svg>
                </button>
                <button
                  @click="deleteItem(item, index)"
                  class="cosmo-button is--icon is--negative"
                  x-localize:design-menus-action-delete_item.title
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M3 6h18" />
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </template>
        <button
          @click="openAddItemDialog(items.length)"
          class="cosmo-button is--circle is--primary is--add is--menu is--last"
        >
          <svg class="jinya-icon is--add is--menu" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
        <div class="jinya-designer-item is--empty is--menu"></div>
      </div>
    </div>
  </template>
  <template x-if="create.open">
    <form @submit.prevent="createMenu" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:design-menus-create-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="create.error.hasError">
            <span class="cosmo-message__header" x-text="create.error.title"></span>
            <p class="cosmo-message__message" x-text="create.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="createMenuName" x-localize:design-menus-create-name></label>
            <input class="cosmo-input" id="createMenuName" required type="text" x-model="create.name" />
            <label class="cosmo-label" for="createMenuLogo" x-localize:design-menus-create-logo></label>
            <button
              :data-picker="create.picker.label"
              @click="selectAddLogo"
              class="cosmo-input is--picker"
              id="createMenuLogo"
              type="button"
              x-text="create.picker.selected"
            ></button>
            <img :src="create.logoPath" alt="" class="jinya-picker__selected-file" x-show="create.logoId" />
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="create.open = false"
            class="cosmo-button"
            type="button"
            x-localize:design-menus-create-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:design-menus-create-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updateMenu" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:design-menus-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editMenuName" x-localize:design-menus-edit-name></label>
            <input class="cosmo-input" id="editMenuName" required type="text" x-model="edit.name" />
            <label class="cosmo-label" for="editMenuLogo" x-localize:design-menus-edit-logo></label>
            <button
              :data-picker="edit.picker.label"
              @click="selectEditLogo"
              class="cosmo-input is--picker"
              id="editMenuLogo"
              type="button"
              x-text="edit.picker.selected"
            ></button>
            <img :src="edit.logoPath" alt="" class="jinya-picker__selected-file" x-show="edit.logoId" />
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="edit.open = false"
            class="cosmo-button"
            type="button"
            x-localize:design-menus-edit-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:design-menus-edit-update></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="addItem.open">
    <form @submit.prevent="insertItem" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:design-menus-designer-add-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="addItemType" x-localize:design-menus-designer-add-type></label>
            <select class="cosmo-select" id="addItemType" required x-model="addItem.type">
              <option value="type_group" x-localize:design-menus-designer-type_group></option>
              <option value="type_external_link" x-localize:design-menus-designer-type_external_link></option>
              <option
                value="type_gallery"
                x-localize:design-menus-designer-type_gallery
                x-show="galleries.length > 0"
              ></option>
              <option
                value="type_classic_page"
                x-localize:design-menus-designer-type_classic_page
                x-show="classicPages.length > 0"
              ></option>
              <option
                value="type_modern_page"
                x-localize:design-menus-designer-type_modern_page
                x-show="modernPages.length > 0"
              ></option>
              <option
                value="type_artist"
                x-localize:design-menus-designer-type_artist
                x-show="artists.length > 0"
              ></option>
              <option value="type_blog_home_page" x-localize:design-menus-designer-type_blog_home_page></option>
              <option
                value="type_blog_category"
                x-localize:design-menus-designer-type_blog_category
                x-show="blogCategories.length > 0"
              ></option>
            </select>
            <label class="cosmo-label" for="addItemTitle" x-localize:design-menus-designer-add-item_title></label>
            <input class="cosmo-input" id="addItemTitle" required type="text" x-model="addItem.title" />
            <template x-if="addItem.type !== 'type_group'">
              <div style="display: contents">
                <label class="cosmo-label" for="addItemRoute" x-localize:design-menus-designer-add-route></label>
                <input class="cosmo-input" id="addItemRoute" required type="text" x-model="addItem.route" />
              </div>
            </template>
            <template x-if="addItem.type === 'type_gallery'">
              <div style="display: contents">
                <label class="cosmo-label" for="addItemGallery" x-localize:design-menus-designer-type_gallery></label>
                <select class="cosmo-select" id="addItemGallery" required x-model.number="addItem.gallery">
                  <template :key="gallery.id" x-for="gallery in galleries">
                    <option :value="gallery.id" x-text="getDropdownLabel(gallery.id, gallery.name)"></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="addItem.type === 'type_classic_page'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="addItemClassicPage"
                  x-localize:design-menus-designer-type_classic_page
                ></label>
                <select class="cosmo-select" id="addItemClassicPage" required x-model.number="addItem.classicPage">
                  <template :key="classicPage.id" x-for="classicPage in classicPages">
                    <option
                      :value="classicPage.id"
                      x-text="getDropdownLabel(classicPage.id, classicPage.title)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="addItem.type === 'type_modern_page'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="addItemModernPage"
                  x-localize:design-menus-designer-type_modern_page
                ></label>
                <select class="cosmo-select" id="addItemModernPage" required x-model.number="addItem.modernPage">
                  <template :key="modernPage.id" x-for="modernPage in modernPages">
                    <option :value="modernPage.id" x-text="getDropdownLabel(modernPage.id, modernPage.name)"></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="addItem.type === 'type_blog_category'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="addItemBlogCategory"
                  x-localize:design-menus-designer-type_blog_category
                ></label>
                <select class="cosmo-select" id="addItemBlogCategory" required x-model.number="addItem.blogCategory">
                  <template :key="blogCategory.id" x-for="blogCategory in blogCategories">
                    <option
                      :value="blogCategory.id"
                      x-text="getDropdownLabel(blogCategory.id, blogCategory.name)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="addItem.type === 'type_artist'">
              <div style="display: contents">
                <label class="cosmo-label" for="addItemArtist" x-localize:design-menus-designer-type_artist></label>
                <select class="cosmo-select" id="addItemArtist" required x-model.number="addItem.artist">
                  <template :key="artist.id" x-for="artist in artists">
                    <option :value="artist.id" x-text="getDropdownLabel(artist.id, artist.artistName)"></option>
                  </template>
                </select>
              </div>
            </template>
            <div class="cosmo-input__group is--checkbox">
              <input class="cosmo-checkbox" id="addItemHighlighted" type="checkbox" x-model="addItem.highlighted" />
              <label
                class="cosmo-label"
                for="addItemHighlighted"
                x-localize:design-menus-designer-add-is_highlighted
              ></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="addItem.open = false"
            class="cosmo-button"
            type="button"
            x-localize:design-menus-designer-add-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:design-menus-designer-add-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="editItem.open">
    <form @submit.prevent="updateItem" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:design-menus-designer-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editItemTitle" x-localize:design-menus-designer-edit-item_title></label>
            <input class="cosmo-input" id="editItemTitle" required type="text" x-model="editItem.title" />
            <template x-if="editItem.type !== 'type_group'">
              <div style="display: contents">
                <label class="cosmo-label" for="editItemRoute" x-localize:design-menus-designer-edit-route></label>
                <input class="cosmo-input" id="editItemRoute" required type="text" x-model="editItem.route" />
              </div>
            </template>
            <template x-if="editItem.type === 'type_gallery'">
              <div style="display: contents">
                <label class="cosmo-label" for="editItemGallery" x-localize:design-menus-designer-type_gallery></label>
                <select class="cosmo-select" id="editItemGallery" required x-model.number="editItem.gallery">
                  <template :key="gallery.id" x-for="gallery in galleries">
                    <option
                      :selected="gallery.id === editItem.gallery"
                      :value="gallery.id"
                      x-text="getDropdownLabel(gallery.id, gallery.name)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="editItem.type === 'type_classic_page'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="editItemClassicPage"
                  x-localize:design-menus-designer-type_classic_page
                ></label>
                <select class="cosmo-select" id="editItemClassicPage" required x-model.number="editItem.classicPage">
                  <template :key="classicPage.id" x-for="classicPage in classicPages">
                    <option
                      :selected="classicPage.id === editItem.gallery"
                      :value="classicPage.id"
                      x-text="getDropdownLabel(classicPage.id, classicPage.title)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="editItem.type === 'type_modern_page'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="editItemModernPage"
                  x-localize:design-menus-designer-type_modern_page
                ></label>
                <select class="cosmo-select" id="editItemModernPage" required x-model.number="editItem.modernPage">
                  <template :key="modernPage.id" x-for="modernPage in modernPages">
                    <option
                      :selected="modernPage.id === editItem.modernPage"
                      :value="modernPage.id"
                      x-text="getDropdownLabel(modernPage.id, modernPage.name)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="editItem.type === 'type_blog_category'">
              <div style="display: contents">
                <label
                  class="cosmo-label"
                  for="editItemBlogCategory"
                  x-localize:design-menus-designer-type_blog_category
                ></label>
                <select class="cosmo-select" id="editItemBlogCategory" required x-model.number="editItem.blogCategory">
                  <template :key="blogCategory.id" x-for="blogCategory in blogCategories">
                    <option
                      :selected="blogCategory.id === editItem.blogCategory"
                      :value="blogCategory.id"
                      x-text="getDropdownLabel(blogCategory.id, blogCategory.name)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <template x-if="editItem.type === 'type_artist'">
              <div style="display: contents">
                <label class="cosmo-label" for="editItemArtist" x-localize:design-menus-designer-type_artist></label>
                <select class="cosmo-select" id="editItemArtist" required x-model.number="editItem.artist">
                  <template :key="artist.id" x-for="artist in artists">
                    <option
                      :selected="artist.id === editItem.artist"
                      :value="artist.id"
                      x-text="getDropdownLabel(artist.id, artist.artistName)"
                    ></option>
                  </template>
                </select>
              </div>
            </template>
            <div class="cosmo-input__group is--checkbox">
              <input class="cosmo-checkbox" id="editItemHighlighted" type="checkbox" x-model="editItem.highlighted" />
              <label
                class="cosmo-label"
                for="editItemHighlighted"
                x-localize:design-menus-designer-edit-is_highlighted
              ></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="editItem.open = false"
            class="cosmo-button"
            type="button"
            x-localize:design-menus-designer-edit-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:design-menus-designer-edit-update></button>
        </div>
      </div>
    </form>
  </template>
</div>

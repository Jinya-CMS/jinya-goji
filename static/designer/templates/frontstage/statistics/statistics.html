<div class="jinya-statistics" x-data="statisticsData">
  <span class="cosmo-title jinya-statistics__title">
    <span x-text="title"></span>
    <small x-text="totalVisits"></small>
  </span>
  <cms-line-diagram
    :interval="$router.params?.interval"
    :range="range"
    class="jinya-statistics__daily"
    group="date"
    name="statistics.access.visits"
  ></cms-line-diagram>
  <cms-world-map
    :range="range"
    class="jinya-statistics__country"
    group="country"
    name="statistics.access.country"
  ></cms-world-map>
  <cms-pie-diagram
    :range="range"
    class="jinya-statistics__language"
    group="language"
    name="statistics.access.language"
    prefix="languages"
  ></cms-pie-diagram>
  <cms-pie-diagram
    :range="range"
    class="jinya-statistics__referer"
    empty="statistics.referer.direct"
    group="referer"
    name="statistics.access.referer"
  ></cms-pie-diagram>
  <cms-pie-diagram
    :range="range"
    class="jinya-statistics__type"
    group="type"
    name="statistics.access.type"
    prefix="statistics.device_type"
  ></cms-pie-diagram>
  <cms-pie-diagram
    :range="range"
    class="jinya-statistics__browser"
    group="browser"
    name="statistics.access.browser"
  ></cms-pie-diagram>
  <cms-pie-diagram :range="range" class="jinya-statistics__os" group="os" name="statistics.access.os"></cms-pie-diagram>
</div>

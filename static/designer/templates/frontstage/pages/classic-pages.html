<div class="cosmo-side-list" x-data="classicPagesData">
  <nav class="cosmo-side-list__items">
    <input
      x-model="searchTerm"
      type="search"
      class="cosmo-input is--sidelist-search"
      x-localize:search-placeholder.placeholder
    />
    <template :key="page.id" x-for="page in filteredPages">
      <a
        :class="{ 'is--active': selectedPage?.id === page.id }"
        @click="selectPage(page)"
        class="cosmo-side-list__item"
        x-text="page.title"
      ></a>
    </template>
    <button @click="openCreateDialog" class="cosmo-button is--full-width" x-localize:pages-classic-action-new></button>
  </nav>
  <template x-if="selectedPage">
    <div class="cosmo-side-list__content jinya-designer">
      <form id="previewForm" method="post" target="_blank" action="/form-api/preview/classic-page">
        <input type="hidden" name="id" :value="selectedPage.id" />
        <input type="hidden" name="content" :value="content" />
      </form>
      <div class="jinya-designer__title">
        <span class="cosmo-title" x-text="title"></span>
      </div>
      <cms-sparkline :entity-id="selectedPage.id" class="jinya-designer__sparkline" type="classic-page"></cms-sparkline>
      <div class="cosmo-toolbar is--designer">
        <div class="cosmo-toolbar__group">
          <button @click="openEditDialog" class="cosmo-button" x-localize:pages-classic-action-edit></button>
          <button @click="deletePage" class="cosmo-button" x-localize:pages-classic-action-delete></button>
        </div>
        <div class="cosmo-toolbar__group">
          <button
            type="submit"
            form="previewForm"
            class="cosmo-button"
            x-localize:pages-classic-action-preview
          ></button>
          <button
            @click="savePage"
            class="cosmo-button is--primary"
            x-localize:pages-classic-action-save_content
          ></button>
        </div>
      </div>
      <div class="jinya-designer__content is--simple-page">
        <cms-toolbar-editor
          :content="content"
          @change="updateContent"
          class="jinya-editor is--simple-page"
          height="calc(var(--page-height) - 2.75rem - 1.25rem - 2rem - 2rem - 0.25rem - 3rem)"
          type="classic-page"
        ></cms-toolbar-editor>
      </div>
    </div>
  </template>
  <template x-if="create.open">
    <form @submit.prevent="createPage" class="cosmo-modal__container">
      <div class="cosmo-modal is--files">
        <h1 class="cosmo-modal__title" x-localize:pages-classic-create-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="create.error.hasError">
            <span class="cosmo-message__header" x-text="create.error.title"></span>
            <p class="cosmo-message__message" x-text="create.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="createPageTitle" x-localize:pages-classic-create-page_title></label>
            <input class="cosmo-input" id="createPageTitle" required type="text" x-model="create.title" />
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="create.open = false"
            class="cosmo-button"
            type="button"
            x-localize:pages-classic-create-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:pages-classic-create-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updatePage" class="cosmo-modal__container">
      <div class="cosmo-modal is--files">
        <h1 class="cosmo-modal__title" x-localize:pages-classic-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editPageTitle" x-localize:pages-classic-edit-page_title></label>
            <input class="cosmo-input" id="editPageTitle" required type="text" x-model="edit.title" />
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="edit.open = false"
            class="cosmo-button"
            type="button"
            x-localize:pages-classic-edit-cancel
          ></button>
          <button class="cosmo-button" type="submit" x-localize:pages-classic-edit-update></button>
        </div>
      </div>
    </form>
  </template>
</div>

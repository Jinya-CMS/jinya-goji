<div class="jinya-profile-view" x-data="profileData">
  <div class="jinya-profile__sidebar">
    <img :alt="$store.artist.artistName" :src="$store.artist.profilePicture" class="jinya-profile__picture" />
  </div>
  <div class="cosmo-title is--profile">
    <span x-text="$store.artist.artistName"></span>
    (<span x-text="$store.artist.email"></span>)
  </div>
  <div class="cosmo-toolbar is--profile">
    <div class="cosmo-toolbar__group">
      <button
        @click="openProfileDialog"
        class="cosmo-button"
        type="button"
        x-localize:my_jinya-my_profile-action-edit_profile
      ></button>
      <button
        @click="openPreferencesDialog"
        class="cosmo-button"
        type="button"
        x-localize:my_jinya-my_profile-action-preferences
      ></button>
    </div>
    <template x-if="$store.artist.totpMode !== 'app'">
      <div class="cosmo-toolbar__group">
        <button
          @click="openEnableTotpDialog"
          class="cosmo-button"
          type="button"
          x-localize:my_jinya-my_profile-action-enable_totp
        ></button>
        <button
          @click="openChangePasswordDialog"
          class="cosmo-button"
          type="button"
          x-localize:my_jinya-my_profile-action-change_password
        ></button>
      </div>
    </template>
    <template x-if="$store.artist.totpMode === 'app'">
      <div class="cosmo-toolbar__group">
        <button
          @click="openChangePasswordDialog"
          class="cosmo-button"
          type="button"
          x-localize:my_jinya-my_profile-action-change_password
        ></button>
      </div>
    </template>
  </div>
  <div
    :class="{ 'is--negative': aboutMe.message.isNegative, 'is--positive': !aboutMe.message.isNegative }"
    class="cosmo-message is--profile"
    x-show="aboutMe.message.hasMessage"
  >
    <span class="cosmo-message__header" x-text="aboutMe.message.title"></span>
    <p class="cosmo-message__message" x-text="aboutMe.message.content"></p>
  </div>
  <cms-toolbar-editor
    :content="aboutMe.data"
    @change="(e) => aboutMe.data = e.value"
    class="jinya-editor is--profile"
    height="calc(var(--page-height) - 2.75rem - 1.25rem - 2rem - 2rem - 0.25rem - 3rem)"
  ></cms-toolbar-editor>
  <div class="cosmo-button__container is--profile">
    <button class="cosmo-button" type="button" x-localize:my_jinya-my_profile-action-discard_profile></button>
    <button
      @click="saveAboutMe"
      class="cosmo-button is--primary"
      type="button"
      x-localize:my_jinya-my_profile-action-save_profile
    ></button>
  </div>
  <template x-if="changePassword.open">
    <form @submit.prevent="updatePassword" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:my_jinya-my_profile-change_password-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="changePassword.error.hasError">
            <span class="cosmo-message__header" x-text="changePassword.error.title"></span>
            <p class="cosmo-message__message" x-text="changePassword.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label
              class="cosmo-label"
              for="oldPassword"
              x-localize:my_jinya-my_profile-change_password-old_password
            ></label>
            <input class="cosmo-input" id="oldPassword" required type="password" x-model="changePassword.oldPassword" />
            <label
              class="cosmo-label"
              for="newPassword"
              x-localize:my_jinya-my_profile-change_password-new_password
            ></label>
            <input class="cosmo-input" id="newPassword" required type="password" x-model="changePassword.newPassword" />
            <label
              class="cosmo-label"
              for="newPasswordRepeat"
              x-localize:my_jinya-my_profile-change_password-new_password_repeat
            ></label>
            <input
              class="cosmo-input"
              id="newPasswordRepeat"
              required
              type="password"
              x-model="changePassword.newPasswordRepeat"
            />
            <span
              class="cosmo-input__message is--negative"
              x-localize:my_jinya-my_profile-change_password-error-not_match
              x-show="changePassword.newPassword !== changePassword.newPasswordRepeat"
            ></span>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="changePassword.open = false"
            class="cosmo-button"
            type="button"
            x-localize:my_jinya-my_profile-change_password-keep
          ></button>
          <button
            :disabled="changePassword.newPassword !== changePassword.newPasswordRepeat"
            class="cosmo-button"
            type="submit"
            x-localize:my_jinya-my_profile-change_password-change
          ></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="appTotp.open">
    <form @submit.prevent="enableTotp" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:my_jinya-my_profile-enable_totp-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="appTotp.error.hasError">
            <span class="cosmo-message__header" x-text="appTotp.error.title"></span>
            <p class="cosmo-message__message" x-text="appTotp.error.message"></p>
          </div>
          <div class="cosmo-message is--information">
            <span class="cosmo-message__header" x-localize:my_jinya-my_profile-enable_totp-qrcode-header></span>
            <p class="cosmo-message__message" x-localize:my_jinya-my_profile-enable_totp-qrcode-message.html></p>
          </div>
          <div class="jinya-totp-qr">
            <img :alt="appTotp.secret" :src="appTotp.qrCode" />
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="code" x-localize:my_jinya-my_profile-enable_totp-code></label>
            <input class="cosmo-input" id="code" maxlength="6" required type="text" x-model="appTotp.code" />
            <span
              class="cosmo-input__message is--information"
              x-localize:my_jinya-my_profile-enable_totp-code_help
            ></span>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="appTotp.open = false"
            class="cosmo-button"
            type="button"
            x-localize:my_jinya-my_profile-enable_totp-cancel
          ></button>
          <button
            :disabled="!appTotp.code"
            class="cosmo-button"
            type="submit"
            x-localize:my_jinya-my_profile-enable_totp-enable
          ></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updateProfile" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:my_jinya-my_profile-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="artistName" x-localize:my_jinya-my_profile-edit-artist_name></label>
            <input class="cosmo-input" id="artistName" required type="text" x-model="edit.artistName" />
            <label class="cosmo-label" for="email" x-localize:my_jinya-my_profile-edit-email></label>
            <input class="cosmo-input" id="email" required type="email" x-model="edit.email" />
            <label
              class="cosmo-label"
              for="profilePictureFile"
              x-localize:my_jinya-my_profile-edit-profile_picture
            ></label>
            <input
              @change="edit.selectProfilePicture($event.target.files)"
              class="cosmo-input"
              id="profilePictureFile"
              type="file"
            />
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="edit.open = false"
            class="cosmo-button"
            type="button"
            x-localize:my_jinya-my_profile-edit-discard_profile
          ></button>
          <button class="cosmo-button" type="submit" x-localize:my_jinya-my_profile-edit-save_profile></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="preferences.open">
    <form @submit.prevent="updatePreferences" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:my_jinya-my_profile-preferences-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="preferences.error.hasError">
            <span class="cosmo-message__header" x-text="preferences.error.title"></span>
            <p class="cosmo-message__message" x-text="preferences.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <span class="cosmo-input__header" x-localize:my_jinya-my_profile-preferences-email></span>
            <label for="loginEmailEnabled" x-localize:my_jinya-my_profile-preferences-login_email_enabled></label>
            <input
              class="cosmo-switch"
              id="loginEmailEnabled"
              type="checkbox"
              x-model="preferences.loginEmailEnabled"
            />
            <span
              class="cosmo-input__message is--information"
              x-localize:my_jinya-my_profile-preferences-login_email_enabled_help.html
            ></span>
            <label
              for="newDeviceEmailEnabled"
              x-localize:my_jinya-my_profile-preferences-new_device_email_enabled
            ></label>
            <input
              class="cosmo-switch"
              id="newDeviceEmailEnabled"
              type="checkbox"
              x-model="preferences.newDeviceEmailEnabled"
            />
            <span
              class="cosmo-input__message is--information"
              x-localize:my_jinya-my_profile-preferences-new_device_email_enabled_help.html
            ></span>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button
            @click="preferences.open = false"
            class="cosmo-button"
            type="button"
            x-localize:my_jinya-my_profile-preferences-keep
          ></button>
          <button class="cosmo-button" type="submit" x-localize:my_jinya-my_profile-preferences-change></button>
        </div>
      </div>
    </form>
  </template>
</div>

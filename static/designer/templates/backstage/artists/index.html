<div class="cosmo-side-list" x-data="artistsData">
  <nav class="cosmo-side-list__items">
    <template :key="artist.id" x-for="artist in artists">
      <a
        :class="{ 'is--active': selectedArtist?.id === artist.id }"
        @click="selectArtist(artist)"
        class="cosmo-side-list__item"
        x-text="artist.artistName"
      ></a>
    </template>
    <button @click="openCreateDialog" class="cosmo-button is--full-width" x-localize:artists-action-new></button>
  </nav>
  <template x-if="selectedArtist">
    <div class="cosmo-side-list__content">
      <div class="jinya-profile-view">
        <div class="jinya-profile__sidebar">
          <img :alt="selectedArtist.artistName" :src="selectedArtist.profilePicture" class="jinya-profile__picture" />
        </div>
        <div class="cosmo-title is--profile">
          <span x-text="selectedArtist.artistName"></span>
          (<span x-text="selectedArtist.email"></span>)
          <template x-if="!selectedArtist.enabled">
            <svg
              fill="none"
              height="24"
              stroke="var(--negative-color)"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect height="11" rx="2" ry="2" width="18" x="3" y="11" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </template>
        </div>
        <div class="cosmo-toolbar is--profile">
          <div class="cosmo-toolbar__group">
            <button
              :disabled="isMe"
              @click="openEditDialog"
              class="cosmo-button"
              x-localize:artists-action-edit
            ></button>
            <button
              :disabled="isMe || selectedArtist.enabled"
              @click="enableArtist"
              class="cosmo-button"
              x-localize:artists-action-enable
            ></button>
            <button
              :disabled="isMe || !selectedArtist.enabled"
              @click="disableArtist"
              class="cosmo-button"
              x-localize:artists-action-disable
            ></button>
            <button
              :disabled="isMe || selectedArtist.totpMode === 'email'"
              @click="resetTotp"
              class="cosmo-button"
              x-localize:artists-action-reset_totp
            ></button>
          </div>
          <div class="cosmo-toolbar__group">
            <button
              :disabled="isMe"
              @click="deleteArtist"
              class="cosmo-button"
              x-localize:artists-action-delete
            ></button>
          </div>
        </div>
        <div x-html="selectedArtist.aboutMe"></div>
      </div>
    </div>
  </template>
  <template x-if="create.open">
    <form @submit.prevent="createArtist" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:artists-create-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="create.error.hasError">
            <span class="cosmo-message__header" x-text="create.error.title"></span>
            <p class="cosmo-message__message" x-text="create.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="createArtistName" x-localize:artists-create-name></label>
            <input class="cosmo-input" id="createArtistName" required type="text" x-model="create.artistName" />
            <label class="cosmo-label" for="createArtistEmail" x-localize:artists-create-email></label>
            <input class="cosmo-input" id="createArtistEmail" required type="email" x-model="create.email" />
            <label class="cosmo-label" for="createArtistPassword" x-localize:artists-create-password></label>
            <input class="cosmo-input" id="createArtistPassword" required type="password" x-model="create.password" />
            <span class="cosmo-label is--checkbox" x-localize:artists-create-roles></span>
            <div class="cosmo-input__group is--checkbox">
              <input
                checked
                class="cosmo-checkbox"
                id="createArtistIsReader"
                type="checkbox"
                value="ROLE_READER"
                x-model="create.roles"
              />
              <label for="createArtistIsReader" x-localize:artists-create-is_reader></label>
            </div>
            <div class="cosmo-input__group is--checkbox">
              <input
                checked
                class="cosmo-checkbox"
                id="createArtistIsWriter"
                type="checkbox"
                value="ROLE_WRITER"
                x-model="create.roles"
              />
              <label for="createArtistIsWriter" x-localize:artists-create-is_writer></label>
            </div>
            <div class="cosmo-input__group is--checkbox">
              <input
                class="cosmo-checkbox"
                id="createArtistIsAdmin"
                type="checkbox"
                value="ROLE_ADMIN"
                x-model="create.roles"
              />
              <label for="createArtistIsAdmin" x-localize:artists-create-is_admin></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button @click="create.open = false" class="cosmo-button" x-localize:artists-create-cancel></button>
          <button class="cosmo-button" type="submit" x-localize:artists-create-create></button>
        </div>
      </div>
    </form>
  </template>
  <template x-if="edit.open">
    <form @submit.prevent="updateArtist" class="cosmo-modal__container">
      <div class="cosmo-modal">
        <h1 class="cosmo-modal__title" x-localize:artists-edit-title></h1>
        <div class="cosmo-modal__content">
          <div class="cosmo-message is--negative" x-show="edit.error.hasError">
            <span class="cosmo-message__header" x-text="edit.error.title"></span>
            <p class="cosmo-message__message" x-text="edit.error.message"></p>
          </div>
          <div class="cosmo-input__group">
            <label class="cosmo-label" for="editArtistName" x-localize:artists-edit-name></label>
            <input class="cosmo-input" id="editArtistName" required type="text" x-model="edit.artistName" />
            <label class="cosmo-label" for="editArtistEmail" x-localize:artists-edit-email></label>
            <input class="cosmo-input" id="editArtistEmail" required type="email" x-model="edit.email" />
            <label class="cosmo-label" for="editArtistPassword" x-localize:artists-edit-password></label>
            <input class="cosmo-input" id="editArtistPassword" type="password" x-model="edit.password" />
            <span class="cosmo-label is--checkbox" x-localize:artists-edit-roles></span>
            <div class="cosmo-input__group is--checkbox">
              <input
                checked
                class="cosmo-checkbox"
                id="editArtistIsReader"
                type="checkbox"
                value="ROLE_READER"
                x-model="edit.roles"
              />
              <label for="editArtistIsReader" x-localize:artists-edit-is_reader></label>
            </div>
            <div class="cosmo-input__group is--checkbox">
              <input
                checked
                class="cosmo-checkbox"
                id="editArtistIsWriter"
                type="checkbox"
                value="ROLE_WRITER"
                x-model="edit.roles"
              />
              <label for="editArtistIsWriter" x-localize:artists-edit-is_writer></label>
            </div>
            <div class="cosmo-input__group is--checkbox">
              <input
                class="cosmo-checkbox"
                id="editArtistIsAdmin"
                type="checkbox"
                value="ROLE_ADMIN"
                x-model="edit.roles"
              />
              <label for="editArtistIsAdmin" x-localize:artists-edit-is_admin></label>
            </div>
          </div>
        </div>
        <div class="cosmo-modal__button-bar">
          <button @click="edit.open = false" class="cosmo-button" x-localize:artists-edit-cancel></button>
          <button class="cosmo-button" type="submit" x-localize:artists-edit-update></button>
        </div>
      </div>
    </form>
  </template>
</div>

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - build
  - deploy

.base-docker:
  image: registry.ulbricht.casa/docker-images/buildah:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - echo "$CI_JOB_TOKEN" | buildah login -u gitlab-ci-token --password-stdin gitlab.imanuel.dev:443

.base-golang:
  image: registry.ulbricht.casa/docker-images/rust-and-go-docker-base-image
  variables:
    RUSTFLAGS: "-C target-feature=-crt-static"
  before_script:
    - apk add just

lint-js:
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/oven/bun:latest
  stage: lint
  script:
    - bun install
    - bun run lint

lint-go:
  extends: .base-golang
  stage: lint
  script:
    - just lint-go

lint-rust:
  extends: .base-golang
  stage: lint
  script:
    - just lint-rust

build:
  extends: .base-golang
  stage: build
  script:
    - just build
  artifacts:
    paths:
      - $CI_PROJECT_DIR/$ARCH/jinya-cms-goji
  parallel:
    matrix:
      - ARCH: amd64
      - ARCH: arm64
  tags:
    - runner-${ARCH}

docker-build-test:
  stage: deploy
  extends: .base-docker
  script:
    - buildah build --build-arg CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --platform=linux/$ARCH -f $CI_PROJECT_DIR/Dockerfile $CI_PROJECT_DIR/$ARCH
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  parallel:
    matrix:
      - ARCH: amd64
      - ARCH: arm64
  tags:
    - runner-$ARCH

docker-build-beta:
  stage: deploy
  extends: .base-docker
  variables:
    IMG: $CI_REGISTRY_IMAGE/$ARCH:1.0.0-beta.$CI_PIPELINE_IID
  script:
    - buildah build --build-arg CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --platform=linux/$ARCH -f $CI_PROJECT_DIR/Dockerfile -t $IMG $CI_PROJECT_DIR/$ARCH
    - buildah push $IMG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  parallel:
    matrix:
      - ARCH: amd64
      - ARCH: arm64
  tags:
    - runner-$ARCH

docker-build:
  stage: deploy
  extends: .base-docker
  variables:
    IMG: $CI_REGISTRY_IMAGE/$ARCH:$CI_COMMIT_TAG
  script:
    - buildah build --build-arg CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --platform=linux/$ARCH -f $CI_PROJECT_DIR/Dockerfile -t $IMG $CI_PROJECT_DIR/$ARCH
    - buildah push $IMG
  rules:
    - if: $CI_COMMIT_TAG
  parallel:
    matrix:
      - ARCH: amd64
      - ARCH: arm64
  tags:
    - runner-${ARCH}

merge-beta-manifests:
  stage: deploy
  extends: .base-docker
  needs:
    - job: docker-build-beta
      artifacts: false
  script:
    - buildah manifest create $FQ_IMAGE_NAME
    - buildah manifest add $FQ_IMAGE_NAME docker://$CI_REGISTRY_IMAGE/amd64:$TAG
    - buildah manifest add $FQ_IMAGE_NAME docker://$CI_REGISTRY_IMAGE/arm64:$TAG
    - buildah manifest push --all $FQ_IMAGE_NAME
  variables:
    TAG: 1.0.0-beta.$CI_PIPELINE_IID
    FQ_IMAGE_NAME: $CI_REGISTRY_IMAGE:$TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

merge-manifests:
  stage: deploy
  extends: .base-docker
  needs:
    - job: docker-build
      artifacts: false
  script:
    - buildah manifest create $FQ_IMAGE_NAME
    - buildah manifest add $FQ_IMAGE_NAME docker://$CI_REGISTRY_IMAGE/amd64:$CI_COMMIT_TAG
    - buildah manifest add $FQ_IMAGE_NAME docker://$CI_REGISTRY_IMAGE/arm64:$CI_COMMIT_TAG
    - buildah manifest push --all $FQ_IMAGE_NAME
  parallel:
    matrix:
      - FQ_IMAGE_NAME: $CI_REGISTRY_IMAGE:latest
      - FQ_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG

[package]
name = "engine"
version = "1.0.0"
edition = "2024"

[dependencies]
actix-web = "4"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
sea-orm = { version = "1", features = ["runtime-tokio", "serde_json", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
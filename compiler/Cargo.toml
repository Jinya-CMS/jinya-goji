[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = "0.4"
md5 = "0.8"
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio", "macros"] }
serde = "1"
serde_json = "1"
swc = "71"
swc_common = { version = "23", features = ["tty-emitter"] }
tokio = { version = "1", features = ["full"] }
warp = { version = "0.4", features = ["server"] }
yaml_serde = "0.10"